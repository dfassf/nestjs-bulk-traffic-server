services:
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: bulk-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      # KRaft 모드: Zookeeper 없이 단독 실행. 클러스터 ID는 KRaft에서 필수
      - CLUSTER_ID=bulk-traffic-local-cluster
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # 자동 생성을 끈다. 켜두면 없는 토픽에 발행할 때 브로커가 파티션 1개짜리로
      # 조용히 만들어버린다. 발행은 정상으로 보이는데 파티션이 1개라
      # 키 라우팅·순서·컨슈머 분배 실험이 전부 성립하지 않는다.
      # 토픽은 앱이 부팅할 때 명시적으로 만든다(OrderTopicProvisioner).
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      # 단일 노드라 replication 팩터 1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      # confluent 이미지 기본 저장 경로
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  # 카프카 상태 UI (선택). 학습·디버깅용
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bulk-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_HOST_PORT:-8090}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
    networks:
      - internal
    depends_on:
      kafka:
        condition: service_healthy

  go-engine:
    build:
      context: ./go-engine
      dockerfile: Dockerfile
    container_name: go-engine
    restart: unless-stopped
    environment:
      - GO_ENGINE_PORT=50051
      - GO_METRICS_PORT=9090
      - GO_POOL_A_WORKERS=4
      - GO_POOL_B_WORKERS=100
      - GO_POOL_C_WORKERS=10
      - GO_POOL_B_RATE_LIMIT=100
      - GO_POOL_C_RATE_LIMIT=10
    networks:
      - internal
    expose:
      - "50051"
      - "9090"
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "--spider", "-q", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"

  postgres:
    image: postgres:16-alpine
    container_name: bench-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bench
      - POSTGRES_USER=bench
      - POSTGRES_PASSWORD=${DB_PASSWORD:-bench}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"

  nestjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - WORKER_ENGINE=go
      - GO_ENGINE_HOST=go-engine
      - GO_ENGINE_PORT=50051
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - UV_THREADPOOL_SIZE=64
      - DISABLE_WORKERS=false
      - WORKER_POOL_SIZE=4
      - QUEUE_CONCURRENT_TASKS=50
      - QUEUE_MAX_CONCURRENT_REQUESTS=200
      - QUEUE_TASK_TIMEOUT_MS=15000
      - QUEUE_EXECUTION_TIMEOUT_MS=10000
      - QUEUE_OVERFLOW_THRESHOLD=3000
      - QUEUE_PERSISTENCE=file
      - QUEUE_SNAPSHOT_PATH=/app/data/.queue-snapshot.json
      - BENCH_DB_DRIVER=${BENCH_DB_DRIVER:-sqlite}
      - BENCH_DB_PATH=/app/data/.bench.sqlite
      - BENCH_PG_HOST=postgres
      - BENCH_PG_PORT=5432
      - BENCH_PG_DATABASE=bench
      - BENCH_PG_USER=bench
      - BENCH_PG_PASSWORD=${DB_PASSWORD:-bench}
    volumes:
      - app-data:/app/data
    networks:
      - internal
    depends_on:
      go-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: "2"

networks:
  internal:
    driver: bridge

volumes:
  app-data:
    driver: local
  pg-data:
    driver: local
  kafka-data:
    driver: local
